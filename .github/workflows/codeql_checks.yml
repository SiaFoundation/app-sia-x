name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
  pull_request:
    # Excluded path: add the paths you want to ignore instead of deleting the workflow
    paths-ignore:
      - '.github/workflows/*.yml'
      - 'tests/*'

jobs:
  analyse:
    name: Analyse
    strategy:
      fail-fast: false
      matrix:
        sdk: ["$NANOX_SDK", "$NANOSP_SDK", "$STAX_SDK", "$FLEX_SDK"]
        # 'cpp' covers C and C++
        language: ['cpp']
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder-legacy:latest

    steps:
      - name: Clone
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # CodeQL will create the database during the compilation
      - name: Build
        run: |
          make BOLOS_SDK=${{ matrix.sdk }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
